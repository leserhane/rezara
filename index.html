<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Optimum Optic — Bientôt à Rabat</title>
<meta name="description" content="Optimum Optic arrive bientôt dans la région de Rabat. Une nouvelle vision de l'optique.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #6b1f2a;
    --bg-deep: #551821;
    --cream: #d9c3a6;
    --cream-light: #f2e2c6;
    --cream-dim: #c9ae8c;
    --shadow-tone: #7d2732;
    --circle: rgba(217,195,166,0.10);
    --circle-strong: rgba(217,195,166,0.16);
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html, body{
    height:100%;
    background: var(--bg);
    color: var(--cream);
    font-family: 'Poppins', 'Helvetica Neue', Arial, sans-serif;
    overflow-x: hidden;
  }

  body{
    position: relative;
    min-height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 50% 30%, var(--bg) 0%, var(--bg-deep) 100%);
  }

  /* Repeating interlocked-rings watermark — Optimum Optic identity */
  .watermark{
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }
  .watermark svg{
    position:absolute;
    width: 100%;
    height: 100%;
  }
  .watermark.layer-1{ opacity: 1; animation: drift 70s linear infinite; }
  .watermark.layer-2{
    opacity: 0.55;
    transform: scale(1.7);
    animation: drift-rev 100s linear infinite;
  }

  @keyframes drift{
    from{ transform: translate(0,0); }
    to{ transform: translate(-220px,-160px); }
  }
  @keyframes drift-rev{
    from{ transform: scale(1.7) translate(0,0); }
    to{ transform: scale(1.7) translate(180px,-200px); }
  }

  .content{
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 6vh 6vw;
    max-width: 720px;
  }

  .mark{
    width: 116px;
    margin: 0 auto 1.6rem;
  }
  .mark svg{ width: 100%; height: auto; display:block; }

  .brand{
    font-size: clamp(2.3rem, 6.2vw, 3.7rem);
    letter-spacing: 0.13em;
    font-weight: 500;
    text-transform: uppercase;
    color: var(--cream-light);
    line-height: 1.1;
  }
  .brand .sub{
    display:block;
    font-size: 0.36em;
    font-weight: 400;
    letter-spacing: 0.5em;
    color: var(--cream);
    margin-top: 0.7rem;
  }

  .tagline{
    margin-top: 1.4rem;
    font-size: clamp(1.05rem, 2.4vw, 1.35rem);
    font-weight: 300;
    letter-spacing: 0.03em;
    color: var(--cream-light);
    font-style: italic;
  }

  .divider{
    width: 56px;
    height: 1px;
    background: var(--cream);
    margin: 2.4rem auto;
    opacity: 0.6;
  }

  .teaser{
    font-size: clamp(0.95rem, 2vw, 1.05rem);
    color: var(--cream-dim);
    line-height: 1.8;
    letter-spacing: 0.02em;
    font-weight: 300;
  }

  .teaser .city{
    color: var(--cream-light);
    font-weight: 600;
    letter-spacing: 0.03em;
  }

  .badge{
    display: inline-block;
    margin-top: 2.6rem;
    padding: 0.6rem 1.6rem;
    border: 1px solid var(--cream);
    border-radius: 999px;
    font-size: 0.72rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--cream-light);
    font-weight: 500;
  }

  footer{
    position: fixed;
    bottom: 1.6rem;
    left: 0;
    right: 0;
    z-index: 1;
    text-align: center;
    font-size: 0.68rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--cream-dim);
    opacity: 0.65;
  }

  @media (max-width: 480px){
    .content{ padding: 8vh 8vw; }
    .divider{ margin: 1.8rem auto; }
    .mark{ width: 92px; }
  }

  @media (prefers-reduced-motion: reduce){
    .watermark.layer-1, .watermark.layer-2{ animation: none; }
  }
</style>
</head>
<body>

  <div class="watermark layer-1">
    <svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
      <defs>
        <pattern id="rings-sm" width="220" height="220" patternUnits="userSpaceOnUse">
          <g fill="none" stroke="var(--circle)" stroke-width="4">
            <circle cx="90" cy="110" r="42"/>
            <circle cx="130" cy="110" r="42"/>
          </g>
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#rings-sm)"/>
    </svg>
  </div>
  <div class="watermark layer-2">
    <svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
      <defs>
        <pattern id="rings-lg" width="340" height="340" patternUnits="userSpaceOnUse">
          <g fill="none" stroke="var(--circle-strong)" stroke-width="3">
            <circle cx="140" cy="170" r="58"/>
            <circle cx="200" cy="170" r="58"/>
          </g>
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#rings-lg)"/>
    </svg>
  </div>

  <main class="content">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 200 140" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f2e2c6"/>
            <stop offset="55%" stop-color="#d9c3a6"/>
            <stop offset="100%" stop-color="#b7997a"/>
          </linearGradient>
        </defs>
        <g fill="none" stroke="url(#ringGrad)" stroke-width="11">
          <circle cx="75" cy="70" r="52"/>
          <circle cx="122" cy="70" r="52"/>
        </g>
      </svg>
    </div>

    <h1 class="brand">Optimum<span class="sub">Optic</span></h1>
    <p class="tagline">Voir le monde avec plus de clarté.</p>

    <div class="divider"></div>

    <p class="teaser">
      Une nouvelle adresse dédiée à votre vue<br>
      arrive bientôt dans la région de <span class="city">Rabat</span>.
    </p>

    <span class="badge">Bientôt disponible</span>
  </main>

  <footer>Optimum Optic — Rabat</footer>

</body>
</html>
