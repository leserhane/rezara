<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Optimum Optic — Bientôt à Rabat</title>
<meta name="description" content="Optimum Optic arrive bientôt dans la région de Rabat. Une nouvelle vision de l'optique.">
<style>
  :root{
    --bg: #0b1320;
    --bg-2: #0f1a2b;
    --gold: #c9a24d;
    --gold-soft: #e3c98a;
    --text: #f3f0e8;
    --text-dim: #a9b2c3;
    --circle: rgba(201,162,77,0.08);
    --circle-strong: rgba(201,162,77,0.14);
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html, body{
    height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    overflow-x: hidden;
  }

  body{
    position: relative;
    min-height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 20% 20%, var(--bg-2), transparent 60%),
      radial-gradient(circle at 80% 85%, var(--bg-2), transparent 55%),
      var(--bg);
  }

  /* Repeating circle watermark — optical lens motif */
  .watermark{
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image:
      radial-gradient(circle, transparent 0 38px, var(--circle) 39px, var(--circle) 40px, transparent 41px),
      radial-gradient(circle, transparent 0 18px, var(--circle-strong) 19px, var(--circle-strong) 20px, transparent 21px);
    background-size: 160px 160px, 160px 160px;
    background-position: 0 0, 0 0;
    opacity: 0.9;
    animation: drift 60s linear infinite;
  }

  .watermark.layer-2{
    background-image:
      radial-gradient(circle, transparent 0 60px, var(--circle) 61px, var(--circle) 62px, transparent 63px);
    background-size: 280px 280px;
    background-position: 90px 60px;
    opacity: 0.6;
    animation: drift-rev 90s linear infinite;
  }

  @keyframes drift{
    from{ background-position: 0 0, 0 0; }
    to{ background-position: 320px 320px, -320px 320px; }
  }
  @keyframes drift-rev{
    from{ background-position: 90px 60px; }
    to{ background-position: -350px 410px; }
  }

  .content{
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 6vh 6vw;
    max-width: 720px;
  }

  .mark{
    width: 78px;
    height: 78px;
    margin: 0 auto 2.2rem;
    position: relative;
  }
  .mark span{
    position: absolute;
    top:0; left:0; right:0; bottom:0;
    border: 1.5px solid var(--gold);
    border-radius: 50%;
  }
  .mark span:nth-child(1){ inset: 0; opacity: 0.95; }
  .mark span:nth-child(2){ inset: 18px; opacity: 0.65; }
  .mark span:nth-child(3){ inset: 33px; opacity: 1; background: var(--gold); border: none; }

  .brand{
    font-size: clamp(2.2rem, 6vw, 3.6rem);
    letter-spacing: 0.14em;
    font-weight: 300;
    text-transform: uppercase;
    color: var(--text);
  }
  .brand strong{
    font-weight: 600;
    color: var(--gold-soft);
  }

  .tagline{
    margin-top: 1.1rem;
    font-size: clamp(1.05rem, 2.4vw, 1.35rem);
    font-weight: 300;
    letter-spacing: 0.03em;
    color: var(--text);
    font-style: italic;
  }

  .divider{
    width: 56px;
    height: 1px;
    background: var(--gold);
    margin: 2.4rem auto;
    opacity: 0.7;
  }

  .teaser{
    font-size: clamp(0.95rem, 2vw, 1.05rem);
    color: var(--text-dim);
    line-height: 1.8;
    letter-spacing: 0.02em;
  }

  .teaser .city{
    color: var(--gold-soft);
    font-weight: 600;
    letter-spacing: 0.03em;
  }

  .badge{
    display: inline-block;
    margin-top: 2.6rem;
    padding: 0.6rem 1.6rem;
    border: 1px solid var(--gold);
    border-radius: 999px;
    font-size: 0.75rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--gold-soft);
  }

  footer{
    position: fixed;
    bottom: 1.6rem;
    left: 0;
    right: 0;
    z-index: 1;
    text-align: center;
    font-size: 0.7rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-dim);
    opacity: 0.6;
  }

  @media (max-width: 480px){
    .content{ padding: 8vh 8vw; }
    .divider{ margin: 1.8rem auto; }
  }

  @media (prefers-reduced-motion: reduce){
    .watermark, .watermark.layer-2{ animation: none; }
  }
</style>
</head>
<body>

  <div class="watermark"></div>
  <div class="watermark layer-2"></div>

  <main class="content">
    <div class="mark" aria-hidden="true"><span></span><span></span><span></span></div>

    <h1 class="brand">Optimum <strong>Optic</strong></h1>
    <p class="tagline">Voir le monde avec plus de clarté.</p>

    <div class="divider"></div>

    <p class="teaser">
      Une nouvelle adresse dédiée à votre vue<br>
      arrive bientôt dans la région de <span class="city">Rabat</span>.
    </p>

    <span class="badge">Bientôt disponible</span>
  </main>

  <footer>Optimum Optic — Rabat</footer>

</body>
</html>
