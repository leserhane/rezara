name: Build Windows installer

# Building the .exe needs to happen on an actual Windows machine (the
# NSIS installer step isn't reliably cross-buildable from Linux without
# Wine), so this uses GitHub's free windows-latest runner instead. The
# desktop shell just points at the live site (see desktop/main.js), so
# this workflow only needs to run again when the shell itself changes —
# every other app update ships instantly to existing installs with no
# rebuild needed.
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: OptimumOptic-Windows-Installer
          path: desktop/release/*.exe
          if-no-files-found: error
