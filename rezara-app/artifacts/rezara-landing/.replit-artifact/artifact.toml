kind = "web"
previewPath = "/rezara-landing/"
title = "Rezara Landing Page"
version = "1.0.0"
id = "artifacts/rezara-landing"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 19396
name = "web"
paths = ["/rezara-landing/"]

[services.development]
run = "pnpm --filter @workspace/rezara-landing run dev"

[services.env]
PORT = "19396"
BASE_PATH = "/rezara-landing/"

[services.production]
build = ["pnpm", "--filter", "@workspace/rezara-landing", "run", "build"]
publicDir = "artifacts/rezara-landing/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
